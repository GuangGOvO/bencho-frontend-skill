name: Release skill
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify version tag
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: python scripts/package.py
      - name: Create immutable version release
        run: gh release create "$RELEASE_TAG" dist/bencho-frontend-*.zip dist/bencho-frontend-*.sha256 --verify-tag --generate-notes --title "Bencho Frontend $RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
